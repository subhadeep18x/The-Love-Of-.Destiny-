
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Love of Destiny</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 18px;
    background: linear-gradient(135deg, #f8f3ff, #e9edff);
    color: #29243b;
    font-family: Georgia, serif;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    padding: 25px 10px 35px;
}

h1 {
    font-size: 34px;
    margin-bottom: 12px;
}

header p {
    color: #77718a;
    font-size: 16px;
}

.card {
    background: white;
    padding: 23px;
    margin-bottom: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #39305b12;
}

.card h2 {
    font-size: 20px;
    font-weight: normal;
    margin: 0 0 17px;
}

audio {
    width: 100%;
}

footer {
    text-align: center;
    color: #77718a;
    padding: 25px 0;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>The Love of Destiny</h1>
    <p>Five stories. Five emotions. One collection.</p>
</header>

<div class="card">
    <h2>1. When Love Changes Everything</h2>
    <audio controls preload="metadata">
        <source src="https://lonely-white-fo0u2slo.edgeone.dev" type="audio/mpeg">
    </audio>
</div>

<div class="card">
    <h2>2. Obsession: A Dangerous Love</h2>
    <audio controls preload="metadata">
        <source src="https://notable-plum-2izwvurl.edgeone.dev" type="audio/mpeg">
    </audio>
</div>

<div class="card">
    <h2>3. A Love We Never Planned</h2>
    <audio controls preload="metadata">
        <source src="https://various-turquoise-lezyabhw.edgeone.dev" type="audio/mpeg">
    </audio>
</div>

<div class="card">
    <h2>4. The Distance Between Us</h2>
    <audio controls preload="metadata">
        <source src="https://legal-apricot-kpopqyrc.edgeone.dev" type="audio/mpeg">
    </audio>
</div>

<div class="card">
    <h2>5. Beyond The Podium</h2>
    <audio controls preload="auto">
        <source src="https://large-aquamarine-95o0qef6.edgeone.dev" type="audio/mpeg">
    </audio>
</div>

<footer>
    The Love of Destiny · Audio Collection
</footer>

</div>

</body>
</html>
